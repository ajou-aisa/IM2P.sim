[package]
name = "im2p-sim"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[lib]
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
test-hooks = []

[[test]]
name = "verilator_activation_packing"
path = "tests/verilator_activation_packing.rs"
required-features = ["test-hooks"]

[build-dependencies]
cc = "1"
